spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ghsicilianotfi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  thymeleaf:
    cache: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

app:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@example.invalid}}

sueldos:
  base: 100000
  por-anio-antiguedad: 5000
  plus-cocinero: 150000
  plus-cocinero-ayudante: 100000
  plus-lavaplatos: 50000
  dias-por-periodo: 15
  porcentaje-por-periodo: 0.50