
spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: never
      data-locations: classpath:CargaDatos.sql
      continue-on-error: true

  thymeleaf:
    cache: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com

canon:
  costo-por-m2: 500
  plus-electricidad-food-truck: 2000
  costo-por-minuto-montaje-puesto: 10

sueldos:
  base: 100000
  por-anio-antiguedad: 5000
  plus-cocinero: 150000
  plus-cocinero-ayudante: 100000
  plus-lavaplatos: 50000
  dias-por-periodo: 15
  porcentaje-por-periodo: 0.50

