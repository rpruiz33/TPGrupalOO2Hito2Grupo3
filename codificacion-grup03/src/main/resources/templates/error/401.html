<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión requerida (401)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .error-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
            padding: 40px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .error-code {
            font-size: 72px;
            font-weight: 800;
            color: #f59e0b;
            line-height: 1;
            margin-bottom: 12px;
        }
        .error-title { font-size: 22px; font-weight: 600; margin-bottom: 12px; }
        .error-desc { font-size: 15px; color: #64748b; margin-bottom: 28px; line-height: 1.5; }
        .btn-primary {
            display: inline-block;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            background-color: #2563eb;
            color: #ffffff;
            border-radius: 6px;
        }
        .btn-primary:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>

<div class="error-card">
    <div class="error-code">401</div>
    <h1 class="error-title">Sesión Requerida</h1>
    <p class="error-desc">Debes identificarte antes de ver esta página o tu sesión ha expirado.</p>
</div>

</body>
</html>
