<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi panel - Epicentro Gourmet</title>
  <link rel="stylesheet" th:href="@{/css/finanzas.css}">
  <link rel="stylesheet" th:href="@{/css/vistas.css}">
</head>

<body>

  <main class="contenedor">

    <header>
      <h1>Epicentro Gourmet</h1>
      <p>Panel General de Unidades de Venta</p>
    </header>

    <!-- Festival Activo -->
    <div class="aviso" style="margin-top: 20px;">
      <span>Festival Activo:</span>
      <strong th:text="${festival != null ? festival.nombre : 'Epicentro Gourmet UNLa 2026'}">
        Epicentro Gourmet UNLa 2026
      </strong>
    </div>

    <!-- Unidades de venta del festival -->
    <section aria-labelledby="t-unidades" style="margin-top: 28px;">
      <h2 id="t-unidades">Unidades de Venta Habilitadas</h2>
      <div class="tabla-scroll">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Unidad de Venta</th>
              <th>Festival</th>
              <th class="text-center no-print">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u : ${unidades}">
              <td th:text="${u.codigo}">FT-001</td>
              <td th:text="${u.nombreComercial}">La Trinchera Gourmet</td>
              <td th:text="${festival != null ? festival.nombre : 'Epicentro Gourmet UNLa 2026'}">Festival</td>
              <td class="text-center no-print">
                <a class="boton" th:href="@{/liquidacion(unidadId=${u.id})}">Ver liquidación</a>
              </td>
            </tr>
            <tr th:if="${unidades == null or #lists.isEmpty(unidades)}">
              <td colspan="4">No hay unidades de venta habilitadas registradas.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <div class="logo">
      <img class="unla-logo-img" alt="Logo UNLa" th:src="@{/images/unla-logo.png}">
    </div>

  </main>
</body>

</html>
