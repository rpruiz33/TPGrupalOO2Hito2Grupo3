<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi panel - Epicentro Gourmet</title>
  <link rel="stylesheet" th:href="@{/css/finanzas.css}">
  <link rel="stylesheet" th:href="@{/css/vistas.css}">
</head>

<body>

  <main class="contenedor" th:with="
  nombreFestival=${festival != null ? festival.nombre : 'Epicentro Gourmet UNLa 2026'},
  listaUnidades=${unidades != null ? unidades : {
    { 'codigo': 'FT-101', 'nombreComercial': 'La Trinchera Gourmet' },
    { 'codigo': 'PD-101', 'nombreComercial': 'Sabores Criollos' },
    { 'codigo': 'FT-102', 'nombreComercial': 'El Buen Sabor Rodante' },
    { 'codigo': 'PD-102', 'nombreComercial': 'La Esquina Dulce' },
    { 'codigo': 'FT-103', 'nombreComercial': 'Burger Master Truck' },
    { 'codigo': 'PD-103', 'nombreComercial': 'Brasas Serranas' },
    { 'codigo': 'FT-104', 'nombreComercial': 'Tacos El Guero' },
    { 'codigo': 'PD-104', 'nombreComercial': 'Pastas de la Nonna' },
    { 'codigo': 'FT-105', 'nombreComercial': 'Ahumados Patagonicos' },
    { 'codigo': 'PD-105', 'nombreComercial': 'Empanadas Salteñas' }
  } }">

    <header>
      <h1>Epicentro Gourmet</h1>
      <p>Panel General de Unidades de Venta</p>
    </header>

    <!-- Festival Activo Único -->
    <div class="aviso" style="margin-top: 20px;">
      <span>Festival Activo:</span>
      <strong th:text="${nombreFestival}">Epicentro Gourmet UNLa 2026</strong>
    </div>

    <!-- Unidades de venta del festival -->
    <section aria-labelledby="t-unidades" style="margin-top: 28px;">
      <h2 id="t-unidades">Unidades de Venta Habilitadas</h2>
      <div class="tabla-scroll">
        <table>
          <thead>
            <tr>
              <th>Código</th>
              <th>Unidad de Venta</th>
              <th>Festival</th>
              <th class="text-center no-print">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="u : ${listaUnidades}">
              <td th:text="${u.codigo}">FT-101</td>
              <td th:text="${u.nombreComercial}">La Trinchera Gourmet</td>
              <td th:text="${nombreFestival}">Epicentro Gourmet UNLa 2026</td>
              <td class="text-center no-print">
                <a class="boton" th:href="@{/liquidacion(codigo=${u.codigo})}">Ver liquidación</a>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(listaUnidades)}">
              <td colspan="4">No hay unidades de venta habilitadas registradas.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <div class="logo">
      <img class="unla-logo-img" alt="Logo UNLa" th:src="@{/images/unla-logo.png}">
    </div>

  </main>
</body>

</html>
