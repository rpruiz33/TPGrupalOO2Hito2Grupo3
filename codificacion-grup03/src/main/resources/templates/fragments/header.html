<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <nav th:fragment="app-navbar(titulo, rol, homeUrl)" class="navbar navbar-dark admin-header px-4 py-2">
        <div class="container-fluid d-flex justify-content-between align-items-center">
               <!-- Logo -->
            <a class="navbar-brand fw-bold d-flex align-items-center gap-3 m-0"
               th:href="@{${homeUrl != null ? homeUrl : '/responsable/index'}}">
                <img th:src="@{/images/unla-logo.png}" alt="Logo UNLa"
                     style="height: 45px; border-radius: 4px;" onerror="this.style.display='none'">
                <div class="d-flex flex-column lh-sm">
                    <span class="fw-bold" style="font-size: 1rem;"
                          th:text="${titulo != null ? titulo : 'Epicentro Gourmet'}">Epicentro Gourmet</span>
                    <span style="font-size: 0.72rem; color: rgba(255,255,255,0.6); font-weight: 400;">Universidad Nacional de Lanús</span>
                </div>
            </a>
            <div style="display: flex; align-items: center; white-space: nowrap;">
                <span style="color: #ffffff; font-weight: 600; font-size: 0.92rem; margin-right: 25px; display: inline-flex; align-items: center;">
                    <span style="margin-right: 6px;">👤</span>
                    <span th:text="${nombreResponsable != null ? nombreResponsable : (rol != null ? rol : 'Responsable')}">
                        Responsable
                    </span>
                </span>
                
                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="btn btn-outline-custom btn-sm px-3 py-1">
                        Cerrar Sesión
                    </button>
                </form>
            </div>

        </div>
    </nav>

</body>
</html>
