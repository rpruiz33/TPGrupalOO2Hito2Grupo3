<!DOCTYPE html>
<html lang="es" 
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
</head>
<body>

    
    <nav th:fragment="app-navbar(titulo, rol, homeUrl)" class="navbar navbar-dark admin-header px-4 py-2">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            
            
            <a class="navbar-brand fw-bold d-flex align-items-center gap-3 m-0" 
               th:href="@{${homeUrl != null ? homeUrl : '/'}}">
                <img th:src="@{/images/unla-logo.png}" alt="UNLa" style="height: 42px;" onerror="this.style.display='none'">
                <span th:text="${titulo != null ? titulo : 'Epicentro Gourmet'}">Epicentro Gourmet</span>
            </a>

            
            <div style="display: flex; align-items: center; white-space: nowrap;">
                <span style="color: #ffffff; font-weight: 600; font-size: 0.92rem; margin-right: 25px; display: inline-flex; align-items: center;">
                    <span style="margin-right: 6px;">👤</span>
                    
                    
                    <span sec:authorize="hasRole('ADMIN')">Administrador</span>

                    
                    <span sec:authorize="hasRole('RESPONSABLE')" 
                          th:text="${nombreResponsable != null ? nombreResponsable : 'Responsable'}">
                        Responsable
                    </span>

                    <span sec:authorize="!hasRole('ADMIN') and !hasRole('RESPONSABLE')" 
                          th:text="${rol != null ? rol : 'Usuario'}">
                        Usuario
                    </span>
                </span>
                
                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="btn btn-outline-custom btn-sm px-3 py-1">
                        Cerrar Sesión
                    </button>
                </form>
            </div>

        </div>
    </nav>

</body>
</html>
