<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel del Personal - Epicentro Gourmet</title>

    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/panel-base.css}">
</head>

<body>

<nav th:replace="~{fragments/header :: app-navbar('Epicentro Gourmet - Personal', 'Empleado', '/empleado/index')}"></nav>

<!-- Contenido Principal -->
<main class="container panel-container mt-4" style="max-width: 850px;">

    <header class="panel-header text-center text-white mb-4">
        <h1 class="fw-bold mb-1">Epicentro Gourmet</h1>
        <h2 class="text-white-50 mb-2">Panel del Personal</h2>
        <p class="unit-info mb-0">Gestión de actividades y consultas personales.</p>
    </header>

    <div th:if="${mensaje}"
         class="alert alert-success text-center py-2 shadow-sm mb-3"
         th:text="${mensaje}">
    </div>

    <div th:if="${error}"
         class="alert alert-danger text-center py-2 shadow-sm mb-3"
         th:text="${error}">
    </div>

    <!-- Opciones del panel en Horizontal -->
    <section>
        <div class="row g-4 justify-content-center">

            <!-- 1. Mi información -->
            <div class="col-12 col-md-6">
                <article class="card menu-card h-100">
                    <div class="card-body text-center d-flex flex-column justify-content-between p-4">

                        <div>
                            <div class="menu-icon fs-1 mb-2" aria-hidden="true">👤</div>
                            <h3 class="fw-bold mb-2" style="color: #800020;">Mi información</h3>
                            <p class="text-secondary small mb-4">
                                Consultá tus datos laborales, festival asignado y recibos de haberes.
                            </p>
                        </div>

                        <div class="d-flex flex-column gap-2 mt-2">
                            <a th:href="@{/mi-informacion}" class="menu-button menu-button-primary w-100 py-2">
                                Mi información
                            </a>
                        </div>

                    </div>
                </article>
            </div>

            <!-- 2. Seguridad -->
            <div class="col-12 col-md-6">
                <article class="card menu-card h-100">
                    <div class="card-body text-center d-flex flex-column justify-content-between p-4">

                        <div>
                            <div class="menu-icon fs-1 mb-2" aria-hidden="true">🔒</div>
                            <h3 class="fw-bold mb-2" style="color: #800020;">Seguridad</h3>
                            <p class="text-secondary small mb-4">
                                Cambiá tu contraseña de acceso periódicamente para proteger tu cuenta.
                            </p>
                        </div>

                        <div class="d-flex flex-column gap-2 mt-2">
                            <a th:href="@{/cambiar-password}" class="menu-button w-100 py-2">
                                Cambiar contraseña
                            </a>
                        </div>

                    </div>
                </article>
            </div>

        </div>
    </section>

</main>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
