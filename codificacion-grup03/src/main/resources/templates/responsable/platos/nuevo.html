
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alta de platos | Epicentro Gourmet</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3f3;
            color: #222;
        }

        header {
            background: #800020;
            color: white;
            padding: 22px 35px;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        main {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border: 1px solid #222;
            border-radius: 10px;
        }

        h2 {
            margin-top: 0;
            color: #800020;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #777;
            border-radius: 5px;
            font-size: 16px;
        }

        .botones {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button, .volver {
            padding: 12px 18px;
            border: 1px solid #222;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #800020;
            color: white;
        }

        .volver {
            background: white;
            color: #222;
        }

        .mensaje {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .exito {
            background: #e1f4e5;
            color: #185c2a;
        }

        .error {
            background: #fbe4e4;
            color: #8a1111;
        }
    </style>
</head>

<body>
<header>
    <h1>Epicentro Gourmet</h1>
</header>

<main>
    <h2>Alta de platos</h2>
    <p>Completá los datos del nuevo plato.</p>

    <div class="mensaje exito"
         th:if="${mensaje}"
         th:text="${mensaje}">
    </div>

    <div class="mensaje error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/responsable/platos/guardar}"
          th:object="${plato}"
          method="post">

        <label for="nombre">Nombre del plato</label>
        <input type="text"
               id="nombre"
               th:field="*{nombre}"
               maxlength="100"
               placeholder="Ej.: Hamburguesa completa"
               required>

        <label for="precio">Precio de venta ($)</label>
        <input type="number"
               id="precio"
               th:field="*{precio}"
               min="0.01"
               step="0.01"
               placeholder="Ej.: 8500.00"
               required>

        <label for="costoProduccion">Costo de producción ($)</label>
        <input type="number"
               id="costoProduccion"
               th:field="*{costoProduccion}"
               min="0"
               step="0.01"
               placeholder="Ej.: 3200.00"
               required>

        <div class="botones">
            <button type="submit">Guardar plato</button>
            <a class="volver" th:href="@{/responsable/index}">
                Volver al panel
            </a>
        </div>
    </form>
</main>
</body>
</html>
