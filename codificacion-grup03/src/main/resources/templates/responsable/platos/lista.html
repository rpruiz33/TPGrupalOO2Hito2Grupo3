<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mis platos | Epicentro Gourmet</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f3f3f3;
            color: #333;
        }

        .contenedor {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            color: #800020;
        }

        .unidad {
            margin-bottom: 25px;
            color: #555;
        }

        .tabla-contenedor {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #800020;
            color: white;
        }

        tbody tr:hover {
            background-color: #f8f2f4;
        }

        .mensaje {
            margin: 15px 0;
            padding: 12px;
            border-radius: 5px;
        }

        .error {
            color: #842029;
            background-color: #f8d7da;
        }

        .exito {
            color: #0f5132;
            background-color: #d1e7dd;
        }

        .vacio {
            padding: 20px;
            text-align: center;
            color: #666;
            background-color: #f7f7f7;
            border-radius: 5px;
        }

        .estado {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .activo {
            color: #0f5132;
            background-color: #d1e7dd;
        }

        .inactivo {
            color: #842029;
            background-color: #f8d7da;
        }

        .boton {
            display: inline-block;
            padding: 9px 13px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
        }

        .principal {
            color: white;
            background-color: #800020;
        }

        .secundario {
            color: #333;
            background-color: #e5e5e5;
        }

        .boton:hover {
            opacity: 0.85;
        }

        .botones {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .contenedor {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <main class="contenedor">

        <h1>Mis platos</h1>

        <p class="unidad" th:if="${unidadVenta != null}">
            <strong>Unidad de venta:</strong>
            <span th:text="${unidadVenta.nombreComercial}"></span>
        </p>

        <div class="mensaje error"
             th:if="${error != null}"
             th:text="${error}">
        </div>

        <div class="mensaje exito"
             th:if="${mensaje != null}"
             th:text="${mensaje}">
        </div>

        <div th:if="${error == null}">

            <div class="tabla-contenedor"
                 th:if="${platos != null and !platos.isEmpty()}">

                <table>
                    <thead>
                        <tr>
                            <th>Nombre del plato</th>
                            <th>Precio de venta</th>
                            <th>Costo de producción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="plato : ${platos}">

                            <td th:text="${plato.nombre}"></td>

                            <td th:text="${'$ ' + #numbers.formatDecimal(plato.precio, 1, 2)}"></td>

                            <td th:text="${'$ ' + #numbers.formatDecimal(plato.costoProduccion, 1, 2)}"></td>

                            <td>
                                <span th:if="${plato.activo}"
                                      class="estado activo">
                                    Activo
                                </span>

                                <span th:unless="${plato.activo}"
                                      class="estado inactivo">
                                    Inactivo
                                </span>
                            </td>

                            <td>
                                <a class="boton principal"
                                   th:href="@{/responsable/platos/modificar/{id}(id=${plato.id})}">
                                    Modificar
                                </a>
                            </td>

                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="vacio"
                 th:if="${platos != null and platos.isEmpty()}">
                Todavía no registraste platos para tu unidad de venta.
            </div>

        </div>

        <div class="botones">

            <a class="boton principal"
               th:href="@{/responsable/platos/nuevo}">
                Registrar plato
            </a>

            <a class="boton secundario"
               th:href="@{/responsable/index}">
                Volver al panel
            </a>

        </div>

    </main>
</body>
</html>
