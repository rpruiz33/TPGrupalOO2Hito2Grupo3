<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Epicentro Gourmet</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/admin-style.css}"/>
</head>
<body>
    <nav class="navbar navbar-dark admin-header px-4 py-2">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-3" href="/admin/dashboard">
                <img th:src="@{/images/unla-logo.png}" alt="UNLa" style="height: 45px;" onerror="this.style.display='none'">
                <span>Epicentro Gourmet - Admin</span>
            </a>
            
            <div class="d-flex align-items-center gap-3">
                <span class="small d-none d-md-inline">Administrador</span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-custom btn-sm px-3 py-1">Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 admin-sidebar p-3 d-none d-md-block">
                <nav class="nav flex-column mt-2">
                    <a class="nav-link nav-link-admin active" href="/admin/dashboard">Inicio</a>
                    <a class="nav-link nav-link-admin" href="/admin/festivales">Festivales</a>
                    <a class="nav-link nav-link-admin" href="/admin/usuarios">Usuarios</a>
                    
                    
                    <a class="nav-link nav-link-admin" th:href="@{/admin/reportes/recaudacion/festival/1}">Reporte Recaudación</a>
                    
                    <a class="nav-link nav-link-admin" href="/cambiar-password">Cambiar Contraseña</a>
                </nav>
            </div>

          
            <div class="col-md-10 p-4 p-md-5">
                <h2 class="fw-bold mb-1">Panel de Control</h2>
                <p class="mb-5" style="color: #e0e0e0;">Resumen del sistema y gestión de Epicentro Gourmet.</p>
                
                <div class="row g-4">
    
    <!-- Festivales Activos -->
    <div class="col-md-4">
        <div class="card card-custom p-2">
            <div class="card-body">
                <h5 class="fw-bold mb-3">Festivales Activos</h5>
                <h2 class="fw-bold m-0" style="color: #800020;" 
                    th:text="${cantFestivalesActivos ?: 0}">0</h2>
            </div>
        </div>
    </div>
    
    <!-- Usuarios Registrados -->
    <div class="col-md-4">
        <div class="card card-custom p-2">
            <div class="card-body">
                <h5 class="fw-bold mb-3">Usuarios Registrados</h5>
                <h2 class="fw-bold m-0" style="color: #800020;" 
                    th:text="${cantUsuariosRegistrados ?: 0}">0</h2>
            </div>
        </div>
    </div>

    <!-- Recaudación Mensual -->
    <div class="col-md-4">
        <div class="card card-custom p-2">
            <div class="card-body">
                <h5 class="fw-bold mb-3">Recaudación Mensual</h5>
                <h2 class="fw-bold m-0" style="color: #800020;" 
                    th:text="'$' + ${#numbers.formatDecimal(recaudacionMensual ?: 0, 1, 'POINT', 2, 'COMMA')}">$0,00</h2>
            </div>
        </div>
    </div>

</div>
            
        </div>
    </div>

    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
