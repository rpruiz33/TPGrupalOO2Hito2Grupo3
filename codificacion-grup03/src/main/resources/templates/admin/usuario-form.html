<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Usuario - Admin</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <style>
        body { background-color: #800020; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { background-color: rgba(255,255,255,0.95); color: #000; border: none; border-radius: 6px; max-width: 520px; margin: auto; }
        .admin-header { background-color: rgba(0, 0, 0, 0.15); border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 2rem; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-dark admin-header px-4 py-2">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/admin/usuarios}">Volver a la Lista</a>
        </div>
    </nav>

    <div class="container py-4 flex-grow-1">
        <div class="card card-custom p-4 shadow-lg">
            
            <h3 class="fw-bold mb-3 text-center">
                <span th:if="${usuario.id == null}">Nuevo Usuario</span>
                <span th:unless="${usuario.id == null}">Editar Usuario</span>
            </h3>

            <div th:if="${error}" class="alert alert-danger text-center shadow-sm" th:text="${error}"></div>

            <!-- Panel informativo de generación y envío automático de contraseña -->
            <div class="card border-info mb-3 bg-light" th:if="${usuario.id == null}">
                <div class="card-body p-3">
                    <div class="d-flex align-items-center mb-1">
                        <span class="fs-5 me-2">✉️</span>
                        <strong class="text-dark">Envío automático de credenciales</strong>
                    </div>
                    <p class="small text-muted mb-0">
                        Al guardar, se generará una contraseña segura aleatoria y se enviará automáticamente un correo electrónico al destinatario con sus credenciales de acceso.
                    </p>
                </div>
            </div>

            <form id="usuarioForm" 
                  th:action="${usuario.id == null} ? @{/admin/usuarios/guardar} : @{/admin/usuarios/actualizar/{id}(id=${usuario.id})}" 
                  th:object="${usuario}" method="post">
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" class="form-control" th:field="*{email}" 
                           placeholder="ejemplo@epicentro.com" required>
                </div>

                <div class="mb-3" th:if="${usuario.id != null}">
                    <label class="form-label fw-bold">Contraseña</label>
                    <input type="password" class="form-control" th:field="*{passwordHash}" 
                           placeholder="Dejar en blanco para mantener la actual si estás editando">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Rol</label>
                    <select class="form-select" th:field="*{rol}" required>
                        <option value="" disabled selected>Seleccione un rol...</option>
                        <option th:each="r : ${roles}" 
                                th:value="${r.id}" 
                                th:text="${r.nombre}">
                        </option>
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" id="btnSubmit" class="btn btn-success w-100 fw-bold">
                        <span th:if="${usuario.id == null}">Crear Usuario y Enviar Mail</span>
                        <span th:unless="${usuario.id == null}">Actualizar Usuario</span>
                    </button>
                    <a th:href="@{/admin/usuarios}" class="btn btn-secondary w-100">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('usuarioForm').addEventListener('submit', function() {
            const btn = document.getElementById('btnSubmit');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Enviando credenciales...';
            this.submit();
        });
    </script>
</body>
</html>
