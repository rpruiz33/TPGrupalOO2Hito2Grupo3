<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festivales - Epicentro Gourmet</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/panel-base.css}"/>
</head>
<body>
    <nav th:replace="~{fragments/header :: app-navbar('Epicentro Gourmet - Admin', 'Administrador', '/admin/dashboard')}"></nav>
    <main class="container panel-container mt-4" style="max-width: 1100px;">
        <section class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4 text-white">
            <div>
                <h1 class="h3 fw-bold mb-1">🎪 Festivales registrados</h1>
                <p class="text-white-50 mb-0">Administrá tus festivales, fechas y unidades de venta.</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/admin/dashboard}" class="menu-button">← Volver al Menu</a>
                <a th:href="@{/admin/festivales/nuevo}" class="menu-button">+ Nuevo festival</a>
            </div>
        </section>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>

        <div th:if="${#lists.isEmpty(festivales)}" class="card menu-card p-5 text-center text-secondary">
            <strong class="fs-5">No hay festivales registrados.</strong>
            <p class="mb-0 mt-1 small">Actualmente no se encuentran festivales cargados en el sistema.</p>
        </div>

        <section class="row g-4" th:unless="${#lists.isEmpty(festivales)}">
            <div class="col-md-6 col-lg-4" th:each="festival : ${festivales}">
                <article class="card menu-card h-100">
                    <div class="card-body p-4 d-flex flex-column justify-content-between">
                        <div>
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <span class="badge" th:classappend="${festival.activo ? 'bg-success' : 'bg-danger'}" th:text="${festival.estado}">Estado</span>
                                <span class="text-secondary small" th:text="${festival.cantidadUnidades} + ' unidades'">0 unidades</span>
                            </div>
                            <h2 class="h5 fw-bold mb-2 text-dark" th:text="${festival.nombre}">Nombre del festival</h2>
                            <div class="text-secondary small mb-3">
                                <div><strong>Inicio:</strong> <span th:text="${festival.fechaInicio != null ? #temporals.format(festival.fechaInicio, 'dd/MM/yyyy') : '-'}">-</span></div>
                                <div><strong>Fin:</strong> <span th:text="${festival.fechaFin != null ? #temporals.format(festival.fechaFin, 'dd/MM/yyyy') : '-'}">-</span></div>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <a class="menu-button" th:href="@{/admin/festivales/{id}(id=${festival.id})}">Ver unidades de venta</a>
                            <a class="btn btn-outline-primary btn-sm" th:href="@{/admin/festivales/editar/{id}(id=${festival.id})}">Editar</a>
                            <form th:if="${festival.activo}" th:action="@{/admin/festivales/baja/{id}(id=${festival.id})}" method="post">
                                <button type="submit" class="btn btn-outline-danger btn-sm w-100" onclick="return confirm('¿Dar de baja este festival?');">Dar de baja</button>
                            </form>
                            <form th:unless="${festival.activo}" th:action="@{/admin/festivales/reactivar/{id}(id=${festival.id})}" method="post">
                                <button type="submit" class="btn btn-outline-success btn-sm w-100">Reactivar</button>
                            </form>
                        </div>
                    </div>
                </article>
            </div>
        </section>
    </main>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
