
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unidades de venta - Epicentro Gourmet</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/admin-style.css}"/>
</head>
<body>

<nav class="navbar navbar-dark admin-header px-4 py-2">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">
            Epicentro Gourmet - Admin
        </a>
        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-custom btn-sm">
                Cerrar Sesión
            </button>
        </form>
    </div>
</nav>

<div class="container py-5">
    <a th:href="@{/admin/festivales}" class="btn btn-secondary mb-4">
        Volver a festivales
    </a>

    <h2 class="fw-bold mb-2"
        th:text="${festival.nombre}">
        Nombre del festival
    </h2>

    <h5 class="mb-4">Unidades de venta habilitadas</h5>

    <div th:if="${#lists.isEmpty(unidades)}" class="alert alert-info">
        Este festival no tiene unidades de venta asociadas.
    </div>


<div class="table-responsive"
     th:unless="${#sets.isEmpty(unidades)}">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Código</th>
                <th>Nombre comercial</th>
                <th>Superficie (m²)</th>
                <th>Responsable</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="unidad : ${unidades}">
                <td th:text="${unidad.codigo}">Código</td>
                <td th:text="${unidad.nombreComercial}">Nombre comercial</td>
                <td th:text="${unidad.superficieM2}">0</td>
             
<td th:text="${unidad.responsable != null
    ? unidad.responsable.nombre + ' ' + unidad.responsable.apellido
    : 'Sin responsable'}">
    Responsable
</td>

            </tr>
        </tbody>
    </table>
</div>

<div th:if="${#sets.isEmpty(unidades)}" class="alert alert-info">
    Este festival no tiene unidades de venta asociadas.
</div>

<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
