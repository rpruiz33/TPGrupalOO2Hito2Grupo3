<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - Admin</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <style>
        body { background-color: #800020; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .admin-header { background-color: rgba(0, 0, 0, 0.15); border-bottom: 1px solid rgba(255,255,255,0.2); }
        .card-custom { background-color: rgba(255,255,255,0.95); color: #000; border: none; border-radius: 6px; }
        .table { margin-bottom: 0; }
        .btn-outline-custom { background-color: transparent; color: #fff; border: 1px solid #fff; border-radius: 4px; }
        .btn-outline-custom:hover { background-color: #fff; color: #800020; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark admin-header px-4 py-2 mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/admin/dashboard">Volver al Panel</a>
        </div>
    </nav>

    <div class="container">
        
        <div th:if="${mensaje}" class="alert alert-success text-center shadow-sm" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alert alert-danger text-center shadow-sm" th:text="${error}"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold m-0">Gestión de Usuarios</h2>
            <a th:href="@{/admin/usuarios/nuevo}" class="btn btn-outline-custom fw-bold px-4 py-2">
                + Nuevo Usuario
            </a>
        </div>

        <div class="card card-custom p-3 shadow-lg">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="u : ${usuarios}">
                        <td th:text="${u.id}"></td>
                        <td class="fw-bold" th:text="${u.email}"></td>
                        <td>
                            <span class="badge bg-secondary" th:text="${u.rol.nombre}"></span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/admin/usuarios/editar/{id}(id=${u.id})}" class="btn btn-sm btn-primary">Editar</a>
                            <a th:href="@{/admin/usuarios/eliminar/{id}(id=${u.id})}" 
                               class="btn btn-sm btn-danger ms-1"
                               onclick="return confirm('¿Estás seguro de eliminar este usuario?');">Eliminar</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
