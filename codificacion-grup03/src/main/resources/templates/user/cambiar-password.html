<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña - Epicentro Gourmet</title>
    
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/modern-business.css}"/>
    <link rel="stylesheet" th:href="@{/css/custom-login.css}"/>
    <style>
        body {
            background-color: #800020;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .change-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            max-width: 480px;
            width: 100%;
            padding: 30px;
        }
        .header-title {
            color: #800020;
            font-weight: 700;
        }
        .btn-custom {
            background-color: #800020;
            border-color: #800020;
            color: #ffffff;
            font-weight: 600;
        }
        .btn-custom:hover {
            background-color: #5c0017;
            border-color: #5c0017;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="change-card">
        <div class="text-center mb-4">
            <h3 class="header-title">Epicentro Gourmet</h3>
            <h5 class="fw-bold text-secondary">Cambiar Contraseña</h5>
            <small class="text-muted" th:text="${email}"></small>
        </div>

        <!-- Alerta de primer ingreso / cambio obligatorio -->
        <div th:if="${esPrimerIngreso}" class="alert alert-warning border-warning shadow-sm">
            <div class="d-flex align-items-center">
                <span class="fs-4 me-2">⚠️</span>
                <div>
                    <strong>Primer inicio de sesión</strong><br/>
                    <small>Por motivos de seguridad, debe cambiar la contraseña temporal que recibió por correo electrónico antes de continuar.</small>
                </div>
            </div>
        </div>

        <div th:if="${error}" class="alert alert-danger text-center shadow-sm" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success text-center shadow-sm" th:text="${mensaje}"></div>

        <form id="cambioPasswordForm" th:action="@{/cambiar-password}" method="post">
            <div class="mb-3">
                <label for="passwordActual" class="form-label fw-bold">Contraseña Actual o Temporal</label>
                <input type="password" class="form-control" id="passwordActual" name="passwordActual" 
                       placeholder="Ingrese la contraseña que recibió por mail" required autofocus/>
            </div>

            <div class="mb-3">
                <label for="nuevaPassword" class="form-label fw-bold">Nueva Contraseña</label>
                <input type="password" class="form-control" id="nuevaPassword" name="nuevaPassword" 
                       placeholder="Mínimo 8 caracteres" minlength="8" required/>
                <div class="form-text">Debe contener al menos 8 caracteres.</div>
            </div>

            <div class="mb-4">
                <label for="confirmarPassword" class="form-label fw-bold">Confirmar Nueva Contraseña</label>
                <input type="password" class="form-control" id="confirmarPassword" name="confirmarPassword" 
                       placeholder="Reingrese la nueva contraseña" minlength="8" required/>
                <div id="passwordMismatchError" class="text-danger small mt-1 d-none">
                    Las contraseñas no coinciden.
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" id="btnSubmitPassword" class="btn btn-custom py-2">
                    Actualizar Contraseña
                </button>
                <a th:unless="${esPrimerIngreso}" href="javascript:history.back()" class="btn btn-outline-secondary py-2">
                    Cancelar
                </a>
            </div>
        </form>

        <div class="text-center mt-4">
            <img class="img-fluid" style="max-height: 45px;" alt="Logo UNLa" th:src="@{/images/unla-logo.png}"/>
        </div>
    </div>

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script>
        document.getElementById('cambioPasswordForm').addEventListener('submit', function(e) {
            const nueva = document.getElementById('nuevaPassword').value.trim();
            const confirm = document.getElementById('confirmarPassword').value.trim();
            const errorDiv = document.getElementById('passwordMismatchError');

            if (nueva !== confirm) {
                e.preventDefault();
                errorDiv.classList.remove('d-none');
                return false;
            } else {
                errorDiv.classList.add('d-none');
            }

            const btn = document.getElementById('btnSubmitPassword');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Actualizando...';
        });
    </script>
</body>
</html>
