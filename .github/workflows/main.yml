name: Email Notifications

on:
  push:
    branches:
      - '**'
  pull_request_target:
    types: [opened, reopened, ready_for_review]

jobs:
  push-email:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send Push Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Nuevo push en ${{ github.repository }} [${{ github.ref_name }}]"
          to: "anav4332816@gmail.com, fsalvatierra@nectica.com, soloagaleonel@gmail.com, rpruiz33@gmail.com"
          from: "GitHub Workflow <${{ secrets.MAIL_USERNAME }}>"
          body: |
            ¡Hola equipo!

            Se ha realizado un nuevo push en el repositorio:
            • Repositorio: ${{ github.repository }}
            • Rama: ${{ github.ref_name }}
            • Autor: ${{ github.actor }}
            • Commit: ${{ github.sha }}

            Ver commit:
            https://github.com/${{ github.repository }}/commit/${{ github.sha }}

  pr-email:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Send PR Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Nuevo PR #${{ github.event.pull_request.number }} en ${{ github.repository }}"
          to: "anav4332816@gmail.com, fsalvatierra@nectica.com, soloagaleonel@gmail.com, rpruiz33@gmail.com"
          from: "GitHub Workflow <${{ secrets.MAIL_USERNAME }}>"
          body: |
            ¡Hola equipo!

            Se abrió un nuevo Pull Request:
            • Repositorio: ${{ github.repository }}
            • Título: ${{ github.event.pull_request.title }}
            • Autor: ${{ github.event.pull_request.user.login }}
            • Rama origen: ${{ github.event.pull_request.head.ref }}
            • Rama destino: ${{ github.event.pull_request.base.ref }}

            Ver PR:
            ${{ github.event.pull_request.html_url }}
